name: Android security and debug build

on:
  push:
    branches: [main, 'security/**', 'build/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source security invariants
        run: python3 .github/scripts/check_security.py

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu provides SDK tools; avoid obsolete setup-android 'tools' package.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Prepare and verify both installable APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for flavor in arm64-v8a universal; do
            source_apk="app/build/outputs/apk/debug/app-${flavor}-debug.apk"
            target_apk="dist/MatrixServer-${flavor}.apk"
            test -s "$source_apk"
            cp "$source_apk" "$target_apk"
          done
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          for apk in dist/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose "$apk"
            "$AAPT" dump badging "$apk" | grep -E "^package:|^sdkVersion:|^native-code:"
            "$AAPT" dump badging "$apk" | grep -q "sdkVersion:'24'"
            sha256sum "$apk"
          done
          printf '%s\n' "Android 7.0+ minimum OS. Debug signature; NOT a production release." > dist/BUILD-NOTES.txt

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MatrixServer-arm64-v8a
          path: dist/MatrixServer-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MatrixServer-universal
          path: dist/MatrixServer-universal.apk
          if-no-files-found: error
          retention-days: 30
