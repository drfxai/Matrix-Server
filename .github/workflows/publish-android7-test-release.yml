name: Publish verified Matrix Server Maximus VPN SSH test APKs

# Publication consumes only successful Android CI artifacts from the current
# main-branch commit. Never reuse a pinned historical workflow run or APK.
on:
  workflow_run:
    workflows: ["Android security and debug build"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: matrix-server-maximus-ssh-test-release
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v1.0.0-ssh-reliability-test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify main source and one-time release gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$SOURCE_SHA" = "$current_main"
          result="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')"
          test "$result" = "success"
          actual_source="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')"
          test "$actual_source" = "$SOURCE_SHA"
          for job_name in security-source android-debug; do
            outcome="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" --jq ".jobs[] | select(.name == \"$job_name\") | .conclusion" | head -n 1)"
            test "$outcome" = "success"
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The immutable test release already exists; not replacing its APKs."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact verified CI artifacts
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging/arm64 staging/universal
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name MatrixServer-arm64-v8a --dir staging/arm64
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name MatrixServer-universal --dir staging/universal
          cp staging/arm64/MatrixServer-arm64-v8a.apk dist/MatrixServer-arm64-v8a.apk
          cp staging/universal/MatrixServer-universal.apk dist/MatrixServer-universal.apk

      - name: Verify integrity, Android identity, signing, and minimum OS
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || printf '%s' /usr/local/lib/android/sdk)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          for artifact in dist/MatrixServer-arm64-v8a.apk dist/MatrixServer-universal.apk; do
            test -s "$artifact"
            unzip -t "$artifact" >/dev/null
            "$APKSIGNER" verify --verbose "$artifact"
            metadata="$("$AAPT" dump badging "$artifact")"
            printf '%s\n' "$metadata" | grep -q "name='com.aistudio.matrixserver.kxmt'"
            printf '%s\n' "$metadata" | grep -q "versionCode='4'"
            printf '%s\n' "$metadata" | grep -q "versionName='1.0'"
            printf '%s\n' "$metadata" | grep -q "sdkVersion:'24'"
            "$APKSIGNER" verify --print-certs "$artifact" > "$artifact.cert-check.txt"
          done
          cert1="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/MatrixServer-arm64-v8a.apk.cert-check.txt | head -n 1)"
          cert2="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/MatrixServer-universal.apk.cert-check.txt | head -n 1)"
          test -n "$cert1" && test "$cert1" = "$cert2"
          (cd dist && sha256sum MatrixServer-arm64-v8a.apk MatrixServer-universal.apk > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cat > dist/RELEASE_NOTES.md <<EOF
          # Matrix Server v1.0.0 — SSH execution and readiness reliability test build

          Fixes SSH exec("sh -s") script delivery by forwarding the remote
          channel's stdin into the Android child process. Adds end-to-end
          local SSH handshake and host-key pin tests, plus SSH-banner readiness
          checks (instead of assuming any open TCP port is SSH). Clears stale
          service startup/shutdown state and fixes custom username in copied SSH
          commands. Retains secure opt-in TCP forwarding and explicit LAN or
          private-overlay endpoint selection from Build 3.
          Only Matrix Server was changed; Maximus VPN was NOT modified.

          - ARM64 and universal APKs for Android 7.0+ (API 24+).
          - Public app version remains 1.0; internal versionCode is 4.
          - GitHub Actions source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN
          - Git source commit: $SOURCE_SHA
          - SHA256SUMS.txt verifies the published APKs.

          **TEST BUILD ONLY. NOT A PRODUCTION SIGNED APK.** The APKs are debug-signed.
          A different debug certificate cannot update an existing installation.
          Do not uninstall the old app without first safeguarding app data,
          authorized keys, and credentials. No Android upgrade/signature
          compatibility has been proven against the previous test release.

          Use Maximus VPN Nodes/Import for the Mihomo SSH YAML, not the two-VPS
          Panels > Maximus Tunnel installer. TCP only; no UDP, VLESS, WireGuard
          or built-in NAT traversal. Your SSH
          server must be reachable over a trusted LAN or a protected private
          overlay. Do not port-forward the SSH daemon onto the public Internet.
          Physical-device VPN end-to-end verification remains outstanding.
          EOF

      - name: Publish immutable prerelease from matching CI run
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/MatrixServer-arm64-v8a.apk \
            dist/MatrixServer-universal.apk \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --prerelease \
            --title "Matrix Server v1.0.0 (Build 4) — SSH Reliability (Android 7+)" \
            --notes-file dist/RELEASE_NOTES.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease \
            --jq '{url: .url, prerelease: .isPrerelease, assets: [.assets[].name]}'
